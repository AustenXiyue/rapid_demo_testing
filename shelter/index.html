/* src/shared/base.css */
/* 避难所 Playtest · 共享样式
 * 暖白底；青绿＝资源与进程；橙＝风险；红只用于严重警告。
 * 状态一律同时显示文字与数值，不只靠颜色。字体只用系统字体，不加载远程资源。 */

:root {
  --bg: #faf6ee;
  --surface: #fffdf8;
  --surface-2: #f4efe4;
  --surface-3: #ece5d6;
  --ink: #2a2620;
  --ink-2: #57504a;
  --muted: #847b70;
  --line: #e3dacb;
  --line-strong: #cfc4b1;
  --teal: #0f6e66;
  --teal-strong: #0b5a53;
  --teal-soft: #dcefe9;
  --orange: #b4540e;
  --orange-soft: #fbe9d6;
  --red: #b42318;
  --red-soft: #fde5e1;
  --violet: #5b4a8a;
  --violet-soft: #ebe6f6;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(60, 40, 10, 0.06), 0 4px 14px rgba(60, 40, 10, 0.05);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.3; font-weight: 650; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
h4 { font-size: 15px; }
p { margin: 0 0 8px; }
ul, ol { margin: 0; padding-left: 20px; }
a { color: var(--teal); }
button, input, select, textarea { font: inherit; color: inherit; }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); }
.nowrap { white-space: nowrap; }
.offscreen { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
.hidden { display: none !important; }
.grow { flex: 1 1 auto; min-width: 0; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 4px; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.icon { display: inline-flex; vertical-align: -2px; }
.icon svg { display: block; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 14px; }
.grid2 > .card, .grid3 > .card, .stack > .card { margin-top: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.card-head h2, .card-head h3 { display: flex; align-items: center; gap: 8px; }
.card.inset { background: var(--surface-2); box-shadow: none; }
.section-note { color: var(--muted); font-size: 13px; margin-top: -4px; margin-bottom: 10px; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
  font-size: 15px;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .seg:focus-visible, .tab:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 1px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-strong); }
.btn.risk { background: var(--orange-soft); border-color: #e7b88d; color: var(--orange); }
.btn.danger { background: var(--red-soft); border-color: #f0b4ab; color: var(--red); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: 14px; }
.btn.big { min-height: 48px; padding: 10px 20px; font-size: 17px; }
.btn.icon-btn { padding: 4px 8px; min-width: 34px; }
.btn-link { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; text-decoration: underline; font-size: inherit; }

/* ---------- 表单 ---------- */
input[type="text"], input[type="number"], input:not([type]), select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #fff;
  padding: 7px 10px;
  min-height: 36px;
  max-width: 100%;
}
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input.num { width: 84px; text-align: center; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(15, 110, 102, 0.35); border-color: var(--teal); }
input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; accent-color: var(--teal); vertical-align: -3px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.field-hint { font-size: 12.5px; color: var(--muted); }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.stepper { display: inline-flex; gap: 4px; align-items: center; }

.segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 6px 12px; min-height: 36px; cursor: pointer; }
.seg:last-child { border-right: 0; }
.seg.on { background: var(--teal); color: #fff; font-weight: 600; }

/* ---------- 标签 ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; font-weight: 600; }
.badge.rule-confirmed { background: var(--teal-soft); border-color: #b4dbd2; color: var(--teal-strong); }
.badge.rule-tentative { background: #fff5d6; border-color: #ecd68f; color: #7a5c00; }
.badge.rule-pending { background: var(--orange-soft); border-color: #eccaa6; color: var(--orange); }
.badge.rule-impl { background: #e7eef8; border-color: #c4d4ea; color: #2c4f7c; }
.badge.rule-draft { background: var(--violet-soft); border-color: #d2c8ec; color: var(--violet); }
.badge.rule-custom { background: var(--surface-3); }
.badge.rule-demo, .badge.demo { background: #fff0c2; border-color: #e7c55c; color: #6b5100; }
.badge.risk { background: var(--orange-soft); border-color: #eccaa6; color: var(--orange); }
.badge.danger { background: var(--red-soft); border-color: #f0b4ab; color: var(--red); }
.badge.ok { background: var(--teal-soft); border-color: #b4dbd2; color: var(--teal-strong); }
.pending-tag { display: inline-block; font-size: 13px; color: var(--orange); background: var(--orange-soft); border: 1px dashed #e2b585; border-radius: 6px; padding: 1px 7px; }

.callout { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }
.callout.risk { background: var(--orange-soft); border-color: #eccaa6; color: #6a3205; }
.callout.danger { background: var(--red-soft); border-color: #f0b4ab; color: #7a1610; }
.callout.ok { background: var(--teal-soft); border-color: #b4dbd2; color: #0b4a44; }
.callout.info { background: #eef3f8; border-color: #cfdcea; color: #2c4058; }

/* ---------- 进度条（文字＋数值） ---------- */
.meter { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter > span { position: absolute; inset: 0 auto 0 0; background: var(--teal); border-radius: 999px; }
.meter.over > span { background: var(--orange); }

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th, .tbl td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--ink-2); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
.tbl tr.current td { background: var(--teal-soft); }
.tbl tr.done td { color: var(--muted); }

.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain > li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.list-plain > li:last-child { border-bottom: 0; }

/* ---------- 复制交接文本 ---------- */
.copy-block { display: flex; flex-direction: column; gap: 6px; }
.copy-text { font-size: 14px; background: #fffef9; font-family: var(--font); }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- 弹窗与提示 ---------- */
.overlay { position: fixed; inset: 0; background: rgba(42, 32, 20, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px 12px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 12px; width: min(520px, 100%); box-shadow: 0 18px 50px rgba(30, 20, 0, 0.25); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal.wide { width: min(760px, 100%); }
.modal-title { font-size: 18px; }
.modal-body { display: flex; flex-direction: column; gap: 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(92vw, 420px); pointer-events: none; }
.toast { background: #2f2a24; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); transition: opacity 0.4s, transform 0.4s; }
.toast.ok { background: var(--teal-strong); }
.toast.warn { background: #8a4210; }
.toast.out { opacity: 0; transform: translateY(6px); }

/* ---------- 横幅 ---------- */
.banner { padding: 8px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.banner.demo { background: #fff0c2; color: #5a4300; }
.banner.danger { background: var(--red-soft); color: #7a1610; }
.banner.risk { background: var(--orange-soft); color: #6a3205; }
.banner.info { background: #eef3f8; color: #2c4058; }

/* ---------- 标签页 ---------- */
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; border-bottom: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
.tab { border: 0; background: none; padding: 11px 13px 9px; cursor: pointer; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; font-size: 15px; display: inline-flex; align-items: center; gap: 5px; }
.tab.on { color: var(--teal-strong); border-bottom-color: var(--teal); font-weight: 650; }

.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 14.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* ---------- 秘密遮挡：内容根本不渲染，只显示这张卡 ---------- */
.gate { text-align: center; padding: 26px 16px; border-style: dashed; background: var(--surface-2); }
.gate h3 { margin: 6px 0; justify-content: center; }
.gate .gate-icon { color: var(--muted); }
.gate .gate-icon .icon svg { width: 28px; height: 28px; }
.reveal-bar { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; background: var(--orange-soft); border: 1px solid #eccaa6; color: #6a3205; padding: 6px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }

@media (max-width: 640px) {
  /* 英文按钮文字较长：窄屏上允许换行，而不是把页面撑宽 */
  .btn { white-space: normal; max-width: 100%; text-align: center; }
  .btn.small, .btn.icon-btn, .lang-btn { white-space: nowrap; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 13px; }
}

/* ---------- 仪表盘部件：指标卡、状态徽章（图标＋文字＋颜色）、同色相进度条 ---------- */
.tile {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow);
  font: inherit; color: inherit;
}
.tile:hover { border-color: var(--line-strong); }
.tile:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 1px; }
.tile-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.tile-label { font-size: 13.5px; color: var(--ink-2); }
.tile-value { font-size: 24px; font-weight: 650; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; }
.tile-unit { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.tile-sub { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

/* 状态徽章：图标形状 + 文字 + 颜色 */
.sev { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; line-height: 1; padding: 4px 8px 4px 6px; border-radius: 999px; white-space: nowrap; }
.sev .icon svg { width: 14px; height: 14px; }
.sev-ok { background: var(--teal-soft); color: var(--teal-strong); }
.sev-info { background: var(--surface-2); color: var(--ink-2); }
.sev-warn { background: var(--orange-soft); color: #8a3f08; }
.sev-crit { background: var(--red-soft); color: var(--red); }

/* 进度条：同一色相，轨道取浅色阶 */
.meter2 { display: block; height: 8px; border-radius: 4px; overflow: hidden; }
.meter2-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.m-ok { background: var(--teal-soft); } .m-ok .meter2-fill { background: var(--teal); }
.m-warn { background: var(--orange-soft); } .m-warn .meter2-fill { background: var(--orange); }
.m-crit { background: var(--red-soft); } .m-crit .meter2-fill { background: var(--red); }
.m-info { background: var(--surface-3); } .m-info .meter2-fill { background: var(--muted); }

/* ---------- 语言切换 ---------- */
.lang-btn { min-width: 44px; font-weight: 650; letter-spacing: 0.02em; white-space: nowrap; flex: 0 0 auto; }

/* ---------- 守夜候选卡（两端共用） ---------- */
.watch-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 8px 0; }
.watch-card {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; padding: 12px 14px;
  border-radius: 12px; border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit;
}
button.watch-card { cursor: pointer; }
button.watch-card:hover { border-color: var(--teal); }
button.watch-card:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 1px; }
.watch-card.on { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); background: #f6fbf9; }

.watch-card-label { display: inline-flex; min-width: 26px; height: 26px; padding: 0 6px; align-items: center; justify-content: center; border-radius: 8px; background: var(--surface-3); color: var(--ink); font-weight: 700; }
.watch-card.on .watch-card-label { background: var(--teal); color: #fff; }
.watch-card-title { flex: 1 1 auto; min-width: 0; }
.watch-card-picked { display: inline-flex; align-items: center; gap: 3px; color: var(--teal-strong); font-weight: 650; }
.watch-card-picked .icon svg { width: 14px; height: 14px; }
.watch-card-who { font-size: 17px; font-weight: 700; line-height: 1.35; }
.watch-card-tend { font-size: 14px; padding-left: 8px; border-left: 3px solid var(--line-strong); }
.watch-card-tend.tend-rescue { border-left-color: var(--teal); color: var(--teal-strong); }
.watch-card-tend.tend-danger { border-left-color: var(--orange); color: #8a3f08; }
.watch-card-fx { display: flex; flex-wrap: wrap; gap: 4px; }
.watch-card-fx .fx { font-size: 13px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.code-reader { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--surface-2); margin-bottom: 10px; }

/* ---------- 守夜卡（第2版）：竖版卡面，四个位置固定 ---------- */
.wcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 8px 0; max-width: 560px; }
.wcard-slot { display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-width: 0; container-type: inline-size; }
.wcard {
  position: relative; display: grid; grid-template-rows: auto 1fr auto; align-items: center; gap: 6px;
  aspect-ratio: 3 / 4; width: 100%; padding: 12px 10px 10px; text-align: center;
  border-radius: 14px; border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit;
  box-shadow: var(--shadow);
}
button.wcard { cursor: pointer; }
button.wcard:hover { border-color: var(--teal); }
button.wcard:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 2px; }
.wcard.on { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft), var(--shadow); }
.wcard-line { align-self: start; min-height: 2.6em; font-size: 13px; font-size: clamp(12px, 6cqi, 16px); line-height: 1.3; color: var(--ink-2); font-style: italic; text-wrap: balance; }
.wcard-names { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.wcard-name { font-size: 20px; font-size: clamp(16px, 12cqi, 28px); font-weight: 750; line-height: 1.2; overflow-wrap: anywhere; }
.wcard-corners { align-self: end; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; font-size: clamp(10.5px, 5cqi, 14px); line-height: 1.25; color: var(--ink-2); text-wrap: balance; }
/* 图标贴在左下／右下角，文字在图标上方，各占半张卡宽 */
.wcard-corner { display: flex; gap: 3px; min-height: 30px; min-width: 0; }
.wcard-corner.left { flex-direction: column-reverse; align-items: flex-start; text-align: left; }
.wcard-corner.right { flex-direction: column; align-items: flex-end; text-align: right; }
.wcard-corner .icon { flex: 0 0 auto; color: var(--teal-strong); }
.wcard-corner .icon svg { width: 22px; height: 22px; }
.wcard.is-all { grid-template-rows: 1fr; background: var(--ink); border-color: var(--ink); color: #fff; }
.wcard.is-all.on { box-shadow: 0 0 0 3px var(--teal), var(--shadow); }
.wcard-all { font-size: 22px; font-size: clamp(18px, 13cqi, 34px); font-weight: 750; line-height: 1.35; padding: 0 6px; text-wrap: balance; }
.wcard-picked, .wcard-caption { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; }
.wcard-picked { color: var(--teal-strong); font-weight: 650; }
.wcard-picked .icon svg { width: 14px; height: 14px; }
.wcard-caption { color: var(--muted); }
.share-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.share-row input { flex: 1 1 220px; min-width: 0; font-size: 13px; }

/* 一键重置（主持人页、玩家页的存档卡里） */
.reset-box { margin-top: 12px; border-color: #f0b4ab; }
</style>

 * 首页＝标题区 + 两张入口卡（创建／加入）+ 我的对局；加入页＝邀请码 + 公开对局；房间＝座位与主导操作。 */

.l-brand b { font-weight: 700; }
.l-top-tools { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.l-user { font-size: 14px; color: var(--ink-2); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.l-main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 16px; }
.l-main > .card + .card { margin-top: 0; }

/* ---------- 标题区（与旧入口页同一套文案风格） ---------- */
.eyebrow { color: var(--muted); font-size: 14px; letter-spacing: 1px; }
.l-hero h1 { font-size: 36px; line-height: 1.2; margin: 4px 0 8px; font-weight: 750; }
.l-hero .lead { color: var(--ink-2); font-size: 16.5px; max-width: 640px; margin: 0; }
.quote { margin: 14px 0 0; padding: 10px 14px; border-left: 3px solid var(--orange); background: var(--orange-soft); color: #6a3205; border-radius: 0 8px 8px 0; font-size: 15px; max-width: 640px; }

/* ---------- 入口卡：创建／加入 ---------- */
.l-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.entry {
  display: flex; flex-direction: column; gap: 8px; padding: 20px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  font: inherit; color: inherit; transition: border-color 0.15s, transform 0.15s;
}
.entry:hover, .entry:focus-visible { border-color: var(--teal); transform: translateY(-1px); outline: none; }
.entry h2 { font-size: 22px; }
.entry p { margin: 0; color: var(--ink-2); font-size: 15px; }
.entry .go { margin-top: auto; padding-top: 6px; color: var(--teal-strong); font-weight: 650; display: inline-flex; align-items: center; gap: 4px; }
.tag { align-self: flex-start; display: inline-block; font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--teal-soft); color: var(--teal-strong); font-weight: 600; }

/* ---------- 对局列表 ---------- */
.game-list { list-style: none; margin: 0; padding: 0; }
.game-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.game-row:first-child { border-top: 0; padding-top: 2px; }
.game-title { font-size: 16.5px; font-weight: 650; overflow-wrap: anywhere; }
.game-meta { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.game-row.closed .game-title { color: var(--ink-2); }

/* ---------- 加入页 ---------- */
.code-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.code-input { font-family: var(--mono); font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; width: 9.5em; text-align: center; }

/* ---------- 房间 ---------- */
.room-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px 20px; flex-wrap: wrap; }
.room-head h1 { font-size: 26px; overflow-wrap: anywhere; }
.room-sub { display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 14px; color: var(--muted); }
.invite { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.invite-code { font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: 0.18em; color: var(--teal-strong); }
.room-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.seat-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.seat { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
.seat.me { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.seat.open { border-style: dashed; background: var(--surface-2); }
.seat-head { display: flex; align-items: center; gap: 8px; }
.seat-no { display: inline-flex; min-width: 26px; height: 26px; padding: 0 6px; align-items: center; justify-content: center; border-radius: 8px; background: var(--surface-3); font-weight: 700; font-size: 13px; }
.seat.me .seat-no { background: var(--teal); color: #fff; }
.seat-name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
.seat-foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* 在线：圆点＋文字，不只靠颜色 */
.presence { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.presence::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
.presence.on { color: var(--teal-strong); }
.presence.on::before { background: var(--teal); }

/* ---------- 登录 ---------- */
.auth { max-width: 420px; width: 100%; margin: 0 auto; }
.auth .segmented { display: flex; margin-bottom: 14px; }
.auth .seg { flex: 1 1 0; }
.auth form { display: flex; flex-direction: column; gap: 12px; }
.auth input { width: 100%; }
.auth input[type="password"] { border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; padding: 7px 10px; min-height: 36px; }

@media (max-width: 640px) {
  .l-main { padding-top: 16px; }
  .l-hero h1 { font-size: 30px; }
  .l-actions { grid-template-columns: minmax(0, 1fr); }
  .invite { align-items: flex-start; }
  .l-user { display: none; }
}

/* 表单里的单选组按内容宽度，不撑满整行 */
.field > .segmented { align-self: flex-start; }
.auth .card { margin-top: 14px; }
</style>
</head>

  var PRE = [
    [/第\s*(\d+)\s*天夜间/g, ' Night of Day $1 '],
    [/第\s*(\d+)\s*天/g, ' Day $1 '],
    [/第\s*(\d+)\s*夜/g, ' Night $1 '],
    [/第\s*(\d+)\s*轮/g, ' Round $1 '],
    [/第\s*(\d+)\s*座/g, ' Seat $1 '],
    [/第\s*(\d+)\s*次/g, ' #$1 '],
    [/第\s*(\d+)\s*份/g, ' List $1 '],
    [/第\s*(\d+)\s*件/g, ' Item $1 '],
    [/第\s*(\d+)\s*张/g, ' Card $1 ']
  ];

  var POST = [
    [/(\d+(?:\.\d+)?)\s*单位/g, '$1 units'],
    [/(\d+)\s*件/g, '$1 pcs'],
    [/(\d+(?:\.\d+)?)\s*秒/g, '$1s'],
    [/(\d+)\s*分钟/g, '$1 min'],
    [/(\d+)\s*人/g, '$1 players'],
    [/(\d+)\s*条/g, '$1'],
    [/(\d+)\s*项/g, '$1 items'],
    [/(\d+)\s*次/g, '$1×'],
    [/(\d+)\s*份/g, '$1'],
    [/(\d+)\s*个/g, '$1'],
    [/(\d+)\s*轮/g, '$1 rounds'],
    [/(\d+)\s*回合/g, '$1 turns'],
    [/(\d+)\s*分/g, '$1 pts']
  ];

  var PUNCT = [
    [/：/g, ': '], [/，/g, ', '], [/。/g, '. '], [/；/g, '; '], [/、/g, ', '], [/！/g, '! '], [/？/g, '? '],
    [/（/g, ' ('], [/）/g, ') '], [/「/g, '“'], [/」/g, '”'], [/『/g, '“'], [/』/g, '”'], [/／/g, '/'], [/～/g, '–'],
    [/【/g, '['], [/】/g, '] '], [/ {2,}/g, ' '], [/ ([,.;:!?)\]])/g, '$1'], [/\( /g, '('], [/\[ /g, '['], [/“ /g, '“'], [/ ”/g, '”']

  /* 按首字符分桶、桶内从长到短，逐位置找最长词条 */

      (index[k[0]] = index[k[0]] || []).push(k);

  }

  function replacePhrases(s) {
    if (!index) buildIndex();

    var i = 0;
    while (i < s.length) {
      var bucket = index[s[i]];
      var hit = null;
      if (bucket) {

        }

    var trail = s.match(/\s*$/)[0];
    var core = s.trim();
    if (Object.prototype.hasOwnProperty.call(dict, core)) return lead + dict[core] + trail;
    // 词条可能带首尾空格（拼接片段），所以在未去空格的原文上替换，最后再还原首尾空白
    var out = s;
    PRE.forEach(function (r) { out = out.replace(r[0], r[1]); });
    out = replacePhrases(out);
    POST.forEach(function (r) { out = out.replace(r[0], r[1]); });
    PUNCT.forEach(function (r) { out = out.replace(r[0], r[1]); });

  }

  /** 把一段要显示的中文换成当前语言。不是字符串、没有中文或当前是中文时原样返回。 */
  function T(s) {
    if (lang !== 'en' || typeof s !== 'string' || !HAN.test(s)) return s;
    if (Object.prototype.hasOwnProperty.call(cache, s)) return cache[s];
    var out = translate(s);
    cache[s] = out;
    return out;
  }

  /** 同一个中文词在不同位置意思不同时（如「口渴」既是栏目名又是状态值），按语境取词：词典里写成「语境|中文」。 */
  function TC(context, s) {
    if (lang !== 'en') return s;
    var k = context + '|' + s;
    return Object.prototype.hasOwnProperty.call(dict, k) ? dict[k] : T(s);
  }

  return {
    T: T,
    TC: TC,
    setLang: setLang,
    getLang: function () { return lang; },
    isEn: function () { return lang === 'en'; },
    _setDict: function (d) { dict = d || {}; index = null; cache = {}; },
    KEY_LANG: KEY_LANG
  };
});

<script>

  }

  function fmtTime(ts) {
    if (!ts) return '';

  }

    var total = Math.max(0, Math.ceil(ms / 1000));

  /** 数字输入：空字符串 → null（表示待配置），否则取整数／小数。 */
  function parseNumber(text, allowDecimal) {

      }

          type: 'button',

   *   onGame(game)   对局状态或座位变化（如暂停）
   *   onGone()       自己已经不在这局（座位被释放、对局被删除）
   *   onError(code)  保存失败（网络断开会自动重试）
   * 同一时间只有一个保存请求在路上，期间的修改合并成最新一份再发。
   */
  function connectOnline(gameId, kind, handlers) {
    var base = location.pathname.replace(/[^/]*$/, '');
    var url = base + 'api/games/' + encodeURIComponent(gameId) + '/state/' + kind;
    var socket = null;
    var toastAt = 0;
    var store = { available: true, lastError: null, version: 0, pending: null, busy: false };

      /** 只读时拦下修改并提示（提示最多 5 秒一次）。 */

        }

      }

      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; });
    }

      return fetch(url, { credentials: 'same-origin' }).then(getJSON, function () { throw { code: 'network' }; }).then(function (res) {
        if (!res.ok) throw { code: res.d.error || 'unknown' };
        store.version = res.d.version;
        ctx.game = res.d.game;
        return res.d.state;
      });
    }

    store.write = function (obj) {
      store.pending = JSON.stringify(obj);
      flush();
      return true;
    };
    store.backup = function () { return false; };
    store.backups = function () { return []; };

    function flush() {
      if (store.busy || store.pending == null) return;
      var body = store.pending;
      store.pending = null;
      store.busy = true;
      fetch(url, {
        method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: '{"version":' + store.version + ',"from":' + JSON.stringify(socket ? socket.id : null) + ',"state":' + body + '}'
      }).then(getJSON).then(function (res) {
        store.busy = false;
        if (res.ok) { store.version = res.d.version; store.lastError = null; return flush(); }

        store.pending = null;
        if (code === 'version_conflict') {

          handlers.onState(res.d.state, 'conflict');
        } else if (code === 'read_only') {
          load().then(function (s) { handlers.onState(s, 'reload'); handlers.onGame(ctx.game); }, function (e) { handlers.onError(e.code); });
        } else {
          store.lastError = { name: code };

<script>
/* src/lobby/lobby.js */
/*
 * 避难所 Playtest · 联机大厅

 * 没登录时显示登录／注册。数据都在服务器上：HTTP 接口做操作，Socket.IO 推送房间变化与在线状态。
 * 界面组件、配色和中英切换与主持人／玩家面板共用（base.css、ui.js、i18n.js）。
 * 用户名和对局标题是玩家输入的内容，用 raw() 原样写入，不经过翻译。
 */
(function () {
  'use strict';

  // 网址没有结尾斜杠时（如 /Misc/ShelterPT）补上，否则相对路径会落到上一级目录
  if (location.protocol !== 'file:' && !/\/$/.test(location.pathname) && !/\.html?$/.test(location.pathname)) {

  var BASE = location.pathname.replace(/[^/]*$/, '');

  var ERRORS = {
    network: '连不上服务器，请稍后再试。',
    unauthorized: '登录已失效，请重新登录。',
    rate_limited: '尝试次数太多，请过几分钟再试。',
    bad_username: '用户名需要 3～20 个字符：中英文、数字、下划线。',
    bad_password: '密码至少 8 位。',
    username_taken: '这个用户名已经被注册了。',
    wrong_credentials: '用户名或密码不对。',
    bad_title: '对局名称需要 1～40 个字。',
    bad_max_seats: '人数上限需要在 1～12 之间。',
    bad_code: '没有找到这个邀请码。',
    game_full: '这局已经满员了。',
    no_open_seat: '这局已经开始，目前没有空出来的座位。',
    game_closed: '这局已经结束了。',
    not_found: '找不到这局对局，或者你已经不在其中。',
    owner_only: '只有主导能这样做。',
    bad_transition: '当前状态下不能这样做。',
    no_players: '至少要有一名玩家才能开始。',
    already_started: '对局已经开始，不能这样做了。',
    not_started: '对局还没开始。',
    use_host_plays: '主导自己的座位请用「参与扮演／只主持」切换。',
    owner_cannot_leave: '主导不能退出，可以删除对局。',

  var STATUS = { lobby: ['info', '招募中'], active: ['ok', '进行中'], paused: ['warning', '已暂停'], finished: ['info', '已结束'] };

  var me = null;

  function raw(s) { return document.createTextNode(String(s == null ? '' : s)); }

  function api(method, path, body) {

      method: method,

  function connect() {

    socket.on('games:changed', function () { if (ui.page === 'home') loadMine(); });
    socket.on('lobby:changed', function () { if (ui.page === 'join') loadOpen(); });
    socket.on('game:update', function (g) {
      if (ui.page === 'room' && g.id === ui.gameId) { ui.game = g; render(); }
    });
    socket.on('game:gone', function (msg) {
      if (ui.page === 'room' && msg.id === ui.gameId) { U.toast('你已经不在这局对局里了。', 'warn'); location.hash = ''; }
    });
    socket.on('connect_error', function (e) { if (e.message === 'unauthorized') signedOut(); });
  }

  function watch() {
    if (!socket) return;
    socket.emit('game:watch', ui.gameId, function (res) {
      if (res.error) { fail({ code: res.error }); location.hash = ''; return; }
      if (ui.page === 'room') { ui.game = res.game; render(); }
    });
  }

  function signedOut() {
    me = null;
    if (socket) { socket.disconnect(); socket = null; }
    render();
  }

  // ---------------------------------------------------------------- 导航与数据

  function route() {
    var m = /^#game=([\w-]+)$/.exec(location.hash);
    var prev = ui.page;
    ui.page = m ? 'room' : location.hash === '#join' ? 'join' : 'home';
    if (prev === 'room' && (!m || m[1] !== ui.gameId) && socket) socket.emit('game:unwatch');
    ui.gameId = m ? m[1] : null;
    if (!me) return render();
    if (ui.page === 'home') loadMine();
    if (ui.page === 'join') loadOpen();
    if (ui.page === 'room') { ui.game = null; watch(); }
    render();
    window.scrollTo(0, 0);
  }

  function loadMine() { api('GET', 'games').then(function (d) { ui.mine = d.games; if (ui.page === 'home') render(); }, fail); }
  function loadOpen() { api('GET', 'games/open').then(function (d) { ui.open = d.games; if (ui.page === 'join') render(); }, fail); }
  function enter(id) { location.hash = 'game=' + id; }

  // ---------------------------------------------------------------- 渲染

  function onLangChange() {
    document.title = U.T(PAGE_TITLE);
    render();
  }

  function render() {
    renderTop();
    var main = U.clear(document.getElementById('main'));
    if (!me) main.appendChild(renderAuth());
    else if (ui.page === 'join') renderJoin(main);
    else if (ui.page === 'room') renderRoom(main);
    else renderHome(main);
  }

  function renderTop() {
    var top = U.clear(document.getElementById('topbar'));
    top.appendChild(h('div', { class: 'l-top' },
      h('button', { type: 'button', class: 'l-brand', onclick: function () { location.hash = ''; } }, h('b', null, '避难所'), h('span', { class: 'brand-role badge' }, '联机大厅')),
      h('div', { class: 'l-top-tools' },
        me ? h('span', { class: 'l-user', title: me.id }, raw(me.username)) : null,
        U.langToggle(onLangChange),
        me ? h('button', { type: 'button', class: 'btn small', onclick: logout }, '退出登录') : null)));
  }

  function renderAuth() {
    var reg = ui.authMode === 'register';
    var user = h('input', { name: 'username', autocomplete: 'username', maxlength: 20, required: true, value: ui.authUser });
    var pass = h('input', { name: 'password', type: 'password', autocomplete: reg ? 'new-password' : 'current-password', maxlength: 200, required: true });
    var submit = h('button', { type: 'submit', class: 'btn primary big' }, reg ? '注册并登录' : '登录');
    var form = h('form', {
      novalidate: true,
      onsubmit: function (ev) {
        ev.preventDefault();
        submit.disabled = true;
        ui.authUser = user.value.trim();
        api('POST', reg ? 'register' : 'login', { username: ui.authUser, password: pass.value }).then(function (d) {
          ui.authError = '';
          me = d.user;
          connect();
          route();
        }, function (e) {
          ui.authError = ERRORS[e.code] || '出错了：' + e.code;
          render();
        });
      }
    },
      U.field('用户名', user, reg ? '3～20 个字符：中英文、数字、下划线。' : null),
      U.field('密码', pass, reg ? '至少 8 位。忘记密码请找管理员重置。' : null),
      ui.authError ? h('div', { class: 'callout danger', role: 'alert' }, ui.authError) : null,
      submit);
    return h('div', { class: 'l-hero auth' },
      h('div', { class: 'eyebrow' }, 'PLAYTEST · 联机'),
      h('h1', null, '避难所 Playtest'),
      h('section', { class: 'card' },
        U.segmented([['login', '登录'], ['register', '注册']], ui.authMode, function (v) { ui.authMode = v; ui.authError = ''; render(); }),
        form));
  }

  function renderHome(main) {
    main.appendChild(h('section', { class: 'l-hero' },
      h('div', { class: 'eyebrow' }, 'PLAYTEST · 规则测试工具'),
      h('h1', null, '避难所 Playtest'),
      h('p', { class: 'lead' }, '末日里，军方把身份各异的人安置进废弃城市的避难所，承诺撤离，然后失约。你们一边求生、一边争取营救，一边因为爱恨、财富和各自的秘密目标做出不同的选择。'),
      h('p', { class: 'quote' }, '军方热线目前忙音。请保持冷静，并清点你的面包。')));
    main.appendChild(h('div', { class: 'l-actions' },
      h('button', { type: 'button', class: 'entry', 'data-entry': 'create', onclick: createGame },
        h('span', { class: 'tag' }, '主导'),
        h('h2', null, '创建对局'),
        h('p', null, '开一局新的游戏：设定人数，选择自己只主持还是也扮演角色，然后把邀请码发给朋友。'),
        h('span', { class: 'go' }, '创建对局', U.icon('arrow'))),
      h('button', { type: 'button', class: 'entry', 'data-entry': 'join', onclick: function () { location.hash = 'join'; } },
        h('span', { class: 'tag' }, '玩家'),
        h('h2', null, '加入对局'),
        h('p', null, '输入朋友给的邀请码，或者在公开列表里挑一局还有空位的。'),
        h('span', { class: 'go' }, '去加入', U.icon('arrow')))));

    var list = ui.mine;
    main.appendChild(h('section', { class: 'card', id: 'my-games' },
      h('div', { class: 'card-head' }, h('h2', null, '我的对局'), list ? h('span', { class: 'muted small' }, list.length + ' 局') : null),
      !list ? h('p', { class: 'empty' }, '载入中…')
        : !list.length ? h('p', { class: 'empty' }, '还没有对局。创建一局，或者加入朋友的对局。')
          : h('ul', { class: 'game-list' }, list.map(function (g) {
            return h('li', { class: 'game-row' + (g.status === 'finished' ? ' closed' : ''), 'data-game': g.id },
              h('div', null,
                h('div', { class: 'game-title' }, raw(g.title)),
                h('div', { class: 'game-meta' },
                  statusBadge(g.status),
                  h('span', { class: 'badge' }, ROLE[g.role]),
                  h('span', null, '主导：', raw(g.owner.username)),
                  h('span', null, g.taken + '／' + g.maxSeats + ' 人'),
                  g.ownerDeleted ? h('span', null, '主导已删除这局') : null,
                  h('span', null, '更新于 ' + U.fmtTime(g.updatedAt)))),
              h('button', { type: 'button', class: 'btn primary', onclick: function () { enter(g.id); } }, U.TC('lobby', '进入')));
          }))));
  }

  function renderJoin(main) {
    var input = h('input', {
      class: 'code-input', maxlength: 6, value: ui.code, autocomplete: 'off', spellcheck: 'false', 'aria-label': '邀请码', placeholder: 'ABC234',
      oninput: function () { ui.code = input.value; }
    });
    main.appendChild(h('div', null, h('button', { type: 'button', class: 'btn ghost small', onclick: function () { location.hash = ''; } }, '← 返回大厅')));
    main.appendChild(h('section', { class: 'card' },
      h('div', { class: 'card-head' }, h('h2', null, '用邀请码加入')),
      h('form', {
        class: 'code-form',
        onsubmit: function (ev) {
          ev.preventDefault();
          api('POST', 'games/join', { code: input.value }).then(function (d) { ui.code = ''; enter(d.id); }, fail);
        }
      }, U.field('邀请码', input, '6 位，不分大小写'), h('button', { type: 'submit', class: 'btn primary' }, U.TC('lobby', '加入')))));

    var list = ui.open;
    main.appendChild(h('section', { class: 'card', id: 'open-games' },
      h('div', { class: 'card-head' },
        h('h2', null, '公开对局'),
        h('button', { type: 'button', class: 'btn small', onclick: loadOpen }, '刷新')),
      h('p', { class: 'section-note' }, '招募中的对局有空位就能加入；已经开始的对局只有被主导空出来的座位可以接手。'),
      !list ? h('p', { class: 'empty' }, '载入中…')
        : !list.length ? h('p', { class: 'empty' }, '现在没有可以加入的对局。')
          : h('ul', { class: 'game-list' }, list.map(function (g) {
            return h('li', { class: 'game-row', 'data-game': g.id },
              h('div', null,
                h('div', { class: 'game-title' }, raw(g.title)),
                h('div', { class: 'game-meta' },
                  statusBadge(g.status),
                  h('span', null, '主导：', raw(g.owner.username)),
                  h('span', null, g.taken + '／' + g.maxSeats + ' 人'),
                  h('span', { class: 'badge ok' }, '空位 ' + g.free))),
              h('button', {
                type: 'button', class: 'btn primary',
                onclick: function () { api('POST', 'games/' + g.id + '/join', {}).then(function (d) { enter(d.id); }, fail); }
              }, g.status === 'lobby' ? U.TC('lobby', '加入') : '接手空座位'));
          }))));
  }

  function renderRoom(main) {
    main.appendChild(h('div', null, h('button', { type: 'button', class: 'btn ghost small', onclick: function () { location.hash = ''; } }, '← 返回大厅')));
    var g = ui.game;
    if (!g) { main.appendChild(h('p', { class: 'empty' }, '载入中…')); return; }
    var isOwner = g.owner.id === me.id;
    var mySeat = g.seats.filter(function (s) { return s.user && s.user.id === me.id; })[0];
    var taken = g.seats.filter(function (s) { return s.user; }).length;
    var open = g.seats.length - taken;

    main.appendChild(h('section', { class: 'card' },
      h('div', { class: 'room-head' },
        h('div', null,
          h('h1', null, raw(g.title)),
          h('div', { class: 'room-sub' },
            statusBadge(g.status),
            h('span', null, '主导：', raw(g.owner.username)), presence(g.owner.online),
            h('span', null, taken + '／' + g.maxSeats + ' 人'))),
        g.status !== 'finished' ? h('div', { class: 'invite' },
          h('span', { class: 'muted small' }, '邀请码'),
          h('span', { class: 'invite-code', id: 'invite-code' }, g.code),
          h('button', {
            type: 'button', class: 'btn small',
            onclick: function () { U.copyText(g.code).then(function (ok) { U.toast(ok ? '邀请码已复制' : '复制失败，请手动抄写', ok ? 'ok' : 'warn'); }); }
          }, U.icon('copy'), '复制')) : null),
      h('div', { class: 'callout ' + (g.status === 'paused' ? 'risk' : 'info'), style: 'margin-top:12px' },
        g.ownerDeleted ? '主导已经删除了这局；记录保留，状态为已结束。'
          : g.status === 'lobby' ? '招募中：把邀请码发给朋友，或者让他们在「加入对局」的公开列表里找到这局。人齐后由主导开始。'
            : g.status === 'active' ? '对局进行中：从下面进入面板。存档保存在服务器上，换设备登录也能接着玩。'
              : g.status === 'paused' ? '已暂停：数据都保存在服务器上，面板现在只能查看。主导点「继续」后，大家回到原来的座位接着玩。'
                : '这局已经结束，面板只能查看。'),
      // 开局后才有面板存档：主导进主持人面板，有座位的进自己的玩家面板（主导兼角色两个都有）
      g.status !== 'lobby' && ((isOwner && !g.ownerDeleted) || mySeat) ? h('div', { class: 'room-actions', id: 'panels', style: 'margin-top:12px' },
        isOwner && !g.ownerDeleted ? h('a', { class: 'btn primary', href: 'host.html?game=' + encodeURIComponent(g.id) }, '进入主持人面板') : null,
        mySeat ? h('a', { class: 'btn ' + (isOwner ? '' : 'primary'), href: 'player.html?game=' + encodeURIComponent(g.id) }, '进入玩家面板') : null) : null));

    main.appendChild(h('section', { class: 'card', id: 'seats' },
      h('div', { class: 'card-head' }, h('h2', null, '座位'), open ? h('span', { class: 'badge ok' }, '空座位 ' + open) : null),
      !g.seats.length ? h('p', { class: 'empty' }, '还没有人入座。') : h('ul', { class: 'seat-list' }, g.seats.map(function (s) {
        var mine = s.user && s.user.id === me.id;
        return h('li', { class: 'seat' + (mine ? ' me' : '') + (s.user ? '' : ' open'), 'data-seat': s.seatNo },
          h('div', { class: 'seat-head' },
            h('span', { class: 'seat-no' }, String(s.seatNo)),
            h('span', { class: 'seat-name' }, s.user ? raw(s.user.username) : '空座位'),
            s.user ? presence(s.user.online) : null),
          h('div', { class: 'seat-foot' },
            s.user && s.user.id === g.owner.id ? h('span', { class: 'badge' }, '主导') : null,
            mine ? h('span', { class: 'badge ok' }, '你') : null,
            s.user ? null : h('span', { class: 'muted small' }, '座位上的数据保留，等新玩家接手'),
            isOwner ? seatAction(g, s) : null));
      }))));

    main.appendChild(renderControls(g, isOwner, mySeat));
  }

  function seatAction(g, s) {
    if (!s.user) return null;
    if (g.status === 'lobby' && s.user.id !== g.owner.id) {
      return h('button', {
        type: 'button', class: 'btn small danger',
        onclick: function () {
          U.confirmBox('移除玩家', [h('b', null, raw(s.user.username)), '：', '移出这局后，对方还可以用邀请码再加入。'], '移除', 'danger').then(function (ok) {
            if (ok) api('POST', 'games/' + g.id + '/seats/' + s.id, { action: 'remove' }).catch(fail);
          });
        }
      }, '移除');
    }
    if (g.status === 'active' || g.status === 'paused') {
      return h('button', {
        type: 'button', class: 'btn small risk',
        onclick: function () {
          U.confirmBox('释放座位', [h('b', null, raw(s.user.username)), '：', '座位上的资源、状态等数据都会保留，但这名玩家会失去这局的访问，座位开放给新玩家接手。'],
            '释放座位', 'risk').then(function (ok) {
            if (ok) api('POST', 'games/' + g.id + '/seats/' + s.id, { action: 'release' }).catch(fail);
          });
        }
      }, '释放座位');
    }
    return null;
  }

  function renderControls(g, isOwner, mySeat) {
    function status(next) { return api('POST', 'games/' + g.id + '/status', { status: next }).catch(fail); }
    var box = h('section', { class: 'card', id: 'controls' }, h('div', { class: 'card-head' }, h('h2', null, isOwner ? '主导操作' : '操作')));
    if (!isOwner) {
      box.appendChild(g.status === 'lobby'
        ? h('div', { class: 'room-actions' }, h('button', {
          type: 'button', class: 'btn danger',
          onclick: function () {
            U.confirmBox('退出对局', '退出后你的座位会空出来，之后还可以用邀请码再加入。', '退出', 'danger').then(function (ok) {
              if (ok) api('POST', 'games/' + g.id + '/leave', {}).then(function () { location.hash = ''; }, fail);
            });
          }
        }, '退出对局'))
        : h('p', { class: 'muted' }, g.status === 'finished' ? '这局已经结束，记录会一直保留。' : '开局后如果要离开，请联系主导释放你的座位。'));
      return box;
    }
    var row = h('div', { class: 'room-actions' });
    if (g.status === 'lobby') {
      row.appendChild(h('button', { type: 'button', class: 'btn primary', disabled: !g.seats.length, onclick: function () { status('active'); } }, '开始对局'));
    }
    if (g.status === 'active') row.appendChild(h('button', { type: 'button', class: 'btn risk', onclick: function () { status('paused'); } }, '暂停'));
    if (g.status === 'paused') row.appendChild(h('button', { type: 'button', class: 'btn primary', onclick: function () { status('active'); } }, U.TC('lobby', '继续')));
    if (g.status === 'active' || g.status === 'paused') {
      row.appendChild(h('button', {
        type: 'button', class: 'btn',
        onclick: function () {
          U.confirmBox('结束对局', '结束后不能再继续，记录会一直保留。', '结束对局', 'danger').then(function (ok) { if (ok) status('finished'); });
        }
      }, '结束对局'));
    }
    row.appendChild(h('button', {
      type: 'button', class: 'btn danger',
      onclick: function () {
        var text = g.status === 'lobby'
          ? '对局和所有座位都会被删除，无法恢复。'
          : '这局会从你的列表里移除并记为已结束。记录仍保存在服务器上，玩家还能查看。';
        U.confirmBox('删除对局', text, '删除', 'danger').then(function (ok) {
          if (ok) api('DELETE', 'games/' + g.id).then(function () { location.hash = ''; }, fail);
        });
      }
    }, '删除对局'));
    box.appendChild(row);
    if (g.status === 'lobby') {
      box.appendChild(h('div', { class: 'field', style: 'margin-top:14px' },
        h('span', { class: 'field-label' }, '我在这局里'),
        U.segmented([['play', '参与扮演'], ['host', '只主持']], mySeat ? 'play' : 'host', function (v) {
          api('POST', 'games/' + g.id + '/host-plays', { on: v === 'play' }).catch(fail);
        }),
        h('span', { class: 'field-hint' }, '开局后不能再切换。')));
    }
    return box;
  }

  // ---------------------------------------------------------------- 操作

  function createGame() {
    var title = h('input', { maxlength: 40, value: U.i18n.isEn() ? me.username + "'s game" : me.username + '的对局' });
    var seats = h('input', { type: 'number', class: 'num', min: 1, max: 12, value: 6 });
    var plays = 'play';
    var seg = h('div', null);
    function drawSeg() { U.clear(seg).appendChild(U.segmented([['play', '参与扮演'], ['host', '只主持']], plays, function (v) { plays = v; drawSeg(); })); }
    drawSeg();
    U.modal({
      title: '创建对局',
      body: [
        U.field('对局名称', title),
        U.field('人数上限', seats, '包括主导自己（如果参与扮演）。1～12，规则建议约 6 人。'),
        h('div', { class: 'field' }, h('span', { class: 'field-label' }, '我在这局里'), seg)
      ],
      actions: [
        { label: '取消', value: null },
        {
          label: '创建', kind: 'primary',
          validate: function () {
            var n = Number(seats.value);
            if (!title.value.trim()) return '请填写对局名称';
            if (!Number.isInteger(n) || n < 1 || n > 12) return '人数上限需要在 1～12 之间。';
            return null;
          },
          value: function () { return { title: title.value.trim(), maxSeats: Number(seats.value), hostPlays: plays === 'play' }; }
        }
      ]
    }).then(function (body) {
      if (body) api('POST', 'games', body).then(function (d) { enter(d.game.id); }, fail);
    });
  }

  function logout() {
    api('POST', 'logout', {}).then(signedOut, fail);
  }

  // ---------------------------------------------------------------- 启动

  document.title = U.T(PAGE_TITLE);
  window.addEventListener('hashchange', route);
  api('GET', 'me').then(function (d) {
    me = d.user;
    if (me) connect();
    route();
  }, function (e) { render(); fail(e); });
})();
</script>
</body>
</html>
